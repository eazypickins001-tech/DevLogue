<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevLogue — offline</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 420px; text-align: center; }
      .logo {
        width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 14px;
        display: grid; place-items: center; background: #4f46e5; color: white;
        font-weight: 700; letter-spacing: -0.04em;
      }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #475569; }
      a {
        display: inline-block; border-radius: 10px; padding: 10px 16px;
        background: #0f172a; color: white; text-decoration: none; font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #020617; color: #e2e8f0; }
        p { color: #94a3b8; }
        a { background: #6366f1; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">DL</div>
      <h1>You are offline</h1>
      <p>DevLogue needs a connection to load your projects and media. Reconnect and try again.</p>
      <a href="/">Retry</a>
    </main>
  </body>
</html>
